<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben Claflin</title>
  <meta name="description" content="Ben Claflin — engineer, national security, product.">
  <style>
    :root {
      --ink: #000;
      --muted: #6b6b6b;
      --rule: #e4e4e4;
      --page: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.5rem;
      padding: 4rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 11vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--ink);
    }

    .logos {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(1.25rem, 4vw, 3.25rem);
      margin: 0;
      padding: 0;
      max-width: 980px;
    }

    .logos li {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 68px;
    }

    .logos img {
      max-height: 68px;
      max-width: 150px;
      width: auto;
      height: auto;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .logos img:hover { opacity: 1; }

    .logo-fallback {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .linkedin {
      display: inline-block;
      font-size: 1rem;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }

    .linkedin:hover { border-bottom-color: var(--ink); }

    @media (max-width: 600px) {
      main { gap: 2.5rem; }
      .logos li { height: 52px; }
      .logos img { max-height: 52px; max-width: 110px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ben Claflin</h1>

    <ul class="logos">
      <li><img src="assets/logos/cdao.png" alt="CDAO" data-name="CDAO"></li>
      <li><img src="assets/logos/inr.png" alt="U.S. Department of State, Bureau of Intelligence and Research" data-name="INR"></li>
      <li><img src="assets/logos/marlinspike.png" alt="Marlinspike" data-name="Marlinspike"></li>
      <li><img src="assets/logos/shi.png" alt="SHI" data-name="SHI"></li>
      <li><img src="assets/logos/ut-austin.png" alt="The University of Texas at Austin" data-name="UT Austin"></li>
    </ul>

    <a class="linkedin" href="https://www.linkedin.com/in/ben-claflin/">linkedin.com/in/ben-claflin</a>
  </main>

  <script>
    // If a logo file hasn't been added yet, show the organization name instead
    // of a broken image.
    document.querySelectorAll(".logos img").forEach(function (img) {
      img.addEventListener("error", function () {
        var span = document.createElement("span");
        span.className = "logo-fallback";
        span.textContent = img.dataset.name;
        img.replaceWith(span);
      });
    });
  </script>
</body>
</html>
